name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # plan-issues.py is the only script with a third-party import.
      - run: pip install pyyaml
      # The tests build throwaway git repos and commit in them.
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Validate skills and agents
        run: python3 scripts/validate.py
      - name: Check eval fixtures
        run: python3 evals/run.py --self-test
      - name: Script tests
        run: python3 -m unittest discover -s tests -t . -v

  # The one check to require: green only when every job above succeeded. A
  # job added to this workflow joins `needs` below.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: amritk/workflows/actions/ci-gate@ac64e0798cf86da4bcdec948b09335334e5eae3c # main, with amritk/workflows#6
        with:
          needs: ${{ toJSON(needs) }}
